# Pulls the NORTIV 8 feed and turns it into the site's catalogue data.
#
# Phase 4 (SASQUATCH_OS.md section 8): scheduled daily, off-peak UTC, with no
# one watching it. It builds the catalogue, checks that every affiliate link
# still resolves, and writes a short report to the run's job summary either
# way. `workflow_dispatch` is kept for a manual run when needed.
#
# The feed address lives in repository secrets and is never printed. This job
# writes data/products.yaml and data/feed_run.yaml, commits them, and then
# explicitly dispatches the deploy workflow — a commit made with the built-in
# Actions token does not trigger other on-push workflows on its own (GitHub's
# loop guard), so the publish step has to be asked for directly.
#
# Alerting (owner decision, 19 October 2026): no custom email. The job
# summary below stays the full record of every run. A real problem - the
# build or a step failing - turns the run red, and GitHub's own failed-run
# notice tells the owner. Softer signals (a broken affiliate link, an
# advertiser relationship that changed, the feed's import date moving) are
# listed at the top of the run report and never fail the run: the Awin
# account is shared with another site, so its changes are not this site's
# problem. The 20 September email step was removed because it had no
# sending mailbox and turned clean runs red.

name: Build catalogue from feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the feed
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: |
          if [ -z "$AWIN_FEED_URL" ]; then
            echo "No AWIN_FEED_URL secret is set on this repository."
            exit 1
          fi
          curl --silent --show-error --fail --location --max-time 120 \
            --output feed.raw "$AWIN_FEED_URL" \
            || { echo "The feed could not be downloaded."; exit 1; }
          echo "Downloaded $(wc -c < feed.raw) bytes."

      # Asks Awin how fresh the feed is (key already in the feed address) and,
      # once AWIN_API_TOKEN exists, which advertisers have approved us and
      # whether anyone clicked through. Runs before the
      # build because the build's freshness rule reads its answer. Never fails
      # the run.
      - name: Record Awin feed freshness and account status
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          # The publisher id is on every affiliate link, so it is a variable,
          # not a secret. Needed because an empty catalogue has no links to
          # read it from.
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID }}
        run: python3 scripts/awin_status.py data

      - name: Build the catalogue
        run: python3 scripts/build_catalogue.py feed.raw data

      # Dark Impact.com importer (owner-approved 19 October 2026). Reads every
      # Impact catalog the account can see, applies the same freshness rule
      # and size guards as the build above, and writes
      # data/impact_products.yaml and data/impact_run.yaml. The site does not
      # read either file yet, so nothing here changes a page. With no Impact
      # secrets set it prints "Impact not configured" and writes nothing.
      # Never fails the run.
      - name: Read Impact catalogs (not published yet)
        continue-on-error: true
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: python3 scripts/impact_catalogue.py data

      - name: Verify affiliate links resolve
        run: python3 scripts/verify_links.py data/products.yaml

      # Reads the files the steps above already wrote — link_check_result.txt,
      # awin_status_report.md, data/feed_run.yaml — plus the job's own status,
      # rather than adding new instrumentation. Runs before the commit step so
      # "the feed's import date moved" can compare against what is still on
      # HEAD. always() so a failed build still reaches this and the run report.
      - name: Determine exceptions
        id: exceptions
        if: always()
        run: |
          reasons=()

          if [ "${{ job.status }}" = "failure" ]; then
            reasons+=("the build failed")
          fi

          if [ -f link_check_result.txt ]; then
            broken=$(head -n1 link_check_result.txt | grep -oE '[0-9]+ broken' | grep -oE '^[0-9]+' || true)
            if [ "${broken:-0}" -gt 0 ] 2>/dev/null; then
              reasons+=("$broken affiliate link(s) are broken")
            fi
          fi

          if [ -f awin_status_report.md ] && grep -q '🔔' awin_status_report.md; then
            reasons+=("an advertiser relationship changed")
          fi

          if [ -f data/feed_run.yaml ]; then
            prev_imported=$(git show HEAD:data/feed_run.yaml 2>/dev/null | grep '^feed_last_imported:' || true)
            new_imported=$(grep '^feed_last_imported:' data/feed_run.yaml || true)
            if [ -n "$prev_imported" ] && [ "$prev_imported" != "$new_imported" ]; then
              reasons+=("the feed's import date moved")
            fi
          fi

          reason=""
          for r in "${reasons[@]}"; do
            if [ -n "$reason" ]; then reason="$reason; $r"; else reason="$r"; fi
          done
          {
            echo "reason<<EXCEPTIONS_EOF"
            echo "$reason"
            echo "EXCEPTIONS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "Exception(s) this run: $reason"
          else
            echo "No exceptions this run."
          fi

      - name: Commit the catalogue if it changed
        id: commit
        run: |
          git config user.name "sasquatch-index bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.yaml data/feed_run.yaml data/awin_status.yaml
          # The Impact files exist only once Impact secrets are set; git add
          # fails on a path that is not there, so each is added only if present.
          for f in data/impact_products.yaml data/impact_run.yaml; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No change in catalogue data — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: catalogue rebuilt from the NORTIV 8 feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the site rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main

      - name: Write the run report
        if: always()
        run: |
          {
            echo "## Sasquatch Index — feed run report"
            echo
            if [ -n "$EXCEPTIONS" ]; then
              echo "**Worth a look:** $EXCEPTIONS"
              echo
            fi
            echo "**Catalogue changed this run:** ${COMMIT_CHANGED:-unknown}"
            echo
            if [ -f data/feed_run.yaml ]; then
              echo "### Feed run"
              echo '```'
              cat data/feed_run.yaml
              echo '```'
            fi
            echo
            if [ -f data/impact_run.yaml ]; then
              echo "### Impact catalogs (not published yet)"
              echo '```'
              cat data/impact_run.yaml
              echo '```'
            fi
            echo
            if [ -f link_check_result.txt ]; then
              echo "### Affiliate link check"
              cat link_check_result.txt
            fi
            echo
            if [ -f awin_status_report.md ]; then
              cat awin_status_report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          COMMIT_CHANGED: ${{ steps.commit.outputs.changed }}
          EXCEPTIONS: ${{ steps.exceptions.outputs.reason }}

      - name: Remove the downloaded feed
        if: always()
        run: rm -f feed.raw awin_status_report.md
