# Sasquatch Index — site configuration
# baseURL is overridden by the deploy workflow with the live Pages address.
baseURL = "https://bitscon.github.io/sasquatch-index/"
languageCode = "en-us"
title = "Sasquatch Index"

# Nothing here needs taxonomies or a feed yet.
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # Shown in the footer. Kept in config so it is not buried in a template.
  tagline = "Shoes in the sizes most retailers stop short of — size 13 and up."
  # A size page is not generated below this many matching products.
  # SASQUATCH_OS.md section 5a: near-empty pages hurt more than they help.
  # FEED_HAZARDS.md hazard 4: this floor cannot be set to zero. Hugo's template
  # default treats an explicit 0 the same as unset, so it silently falls back
  # to 3 either way — that is not a bug to fix, it is the intended floor, but
  # do not mistake 0 here for "generate everything."
  minProducts = 3
  # Cloudflare Web Analytics site token. Empty means no analytics script is
  # emitted AND the privacy page states that no analytics runs. Setting it
  # turns on the (cookieless) beacon and flips the privacy wording to match —
  # one value, both surfaces, never out of step.
  cloudflareAnalyticsToken = "e1d400ad1b2744a8ae7b7bc369558309"
